<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu entrada · Un día en El Paraíso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  :root { --ink: #17221f; --soft: #56655a; --amber: #a8640f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #dde7ea 0%, #f6efd2 45%, #e8c08a 80%, #b97a63 100%);
    color: var(--ink); font-family: "Albert Sans", system-ui, sans-serif;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .ticket { width: min(100%, 380px); background: #fffdf8; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow: hidden; }
  .top { padding: 22px 22px 16px; }
  h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 1.9rem; line-height: 1.05; margin: 0 0 6px; }
  .meta { color: var(--soft); margin: 0; font-size: .95rem; }
  .cut { border-top: 2px dashed #d9cfbd; margin: 0 14px; }
  .qr { padding: 22px; display: grid; justify-items: center; gap: 12px; }
  .qr svg { width: 100%; max-width: 280px; height: auto; }
  .qr p { margin: 0; color: var(--soft); text-align: center; font-size: .92rem; }
  .err { padding: 22px; color: #9b2c1c; }
</style>
</head>
<body>
  <main class="ticket">
    <div class="top">
      <h1>Un día en El Paraíso</h1>
      <p class="meta">Sábado 21 de noviembre · desde las 10:00<br>Ruta 12 km 8,5, Punta Ballena</p>
    </div>
    <div class="cut"></div>
    <div class="qr" id="qr"></div>
  </main>
<script>
  (function () {
    var box = document.getElementById('qr');
    var m = location.hash.match(/t=([a-f0-9]{32})/);
    if (!m) { box.className = 'err'; box.textContent = 'Este link de entrada no es válido. Revisá el mail de confirmación.'; return; }
    var url = location.origin + location.pathname.replace(/entrada\.html$/, '') + 'checkin.html#t=' + m[1];
    var q = qrcode(0, 'M'); q.addData(url); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) +
      '<p>Mostrá este código en la puerta. Una entrada por persona.</p>';
  })();
</script>
</body>
</html>
